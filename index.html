<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simplenote Plus</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f5f7fb;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      background: #f5f7fb;
    }

    button, input, textarea { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
    }

    #loginPanel {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(92vw, 420px);
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 12px 32px rgba(0,0,0,.06);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .muted {
      color: #6b7280;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 14px;
      font-weight: 650;
    }

    .login-card input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px 14px;
      background: white;
      color: #111827;
    }

    .primary-btn {
      background: #2f66e9;
      color: white;
      border-radius: 10px;
      padding: 11px 15px;
      font-weight: 700;
    }

    .dark-btn {
      background: #111827;
      color: white;
      border-radius: 10px;
      padding: 11px 15px;
      font-weight: 700;
    }

    #loginForm .primary-btn {
      width: 100%;
      margin-top: 18px;
    }

    #status {
      min-height: 20px;
      margin-top: 12px;
      color: #6b7280;
      font-size: 14px;
    }

    #appShell {
      display: none;
      height: 100vh;
      background: white;
    }

    .sidebar {
      width: 330px;
      min-width: 280px;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      background: #fbfcfe;
    }

    .sidebar-header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #2f66e9;
      color: white;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 9px;
    }

    .account-email {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #6b7280;
      font-size: 13px;
    }

    .signout-link {
      background: transparent;
      color: #6b7280;
      font-size: 13px;
      padding: 4px;
    }

    .search-wrap {
      padding: 12px 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    #searchInput {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      background: white;
      color: #111827;
      outline: none;
    }

    #searchInput:focus {
      border-color: #7aa2ff;
      box-shadow: 0 0 0 3px rgba(47,102,233,.10);
    }

    #notesStatus {
      padding: 8px 14px 0;
      min-height: 26px;
      color: #6b7280;
      font-size: 13px;
    }

    #notesList {
      flex: 1;
      overflow: auto;
    }

    .note-item {
      padding: 14px 16px;
      border-bottom: 1px solid #eceff3;
      cursor: pointer;
      background: transparent;
    }

    .note-item:hover {
      background: #f1f5fb;
    }

    .note-item.active {
      background: #eaf1ff;
    }

    .note-title {
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-preview {
      margin-top: 5px;
      font-size: 13px;
      color: #6b7280;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-time {
      margin-top: 5px;
      font-size: 12px;
      color: #9ca3af;
    }

    .empty-list {
      padding: 28px 18px;
      color: #6b7280;
      text-align: center;
      font-size: 14px;
    }

    .editor {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .editor-topbar {
      min-height: 62px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
    }

    #mobileBackBtn {
      display: none;
      background: transparent;
      color: #2f66e9;
      font-weight: 700;
      padding: 8px 0;
    }

    #saveStatus {
      color: #6b7280;
      font-size: 13px;
      text-align: right;
      margin-left: 6px;
      white-space: nowrap;
    }

    .editor-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .tool-btn {
      border-radius: 9px;
      padding: 8px 11px;
      background: #eef2f7;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    .tool-btn.active {
      background: #dbe8ff;
      color: #1d4ed8;
    }

    .tool-btn.danger {
      background: #fff1f2;
      color: #be123c;
    }

    .editor-body {
      flex: 1;
      overflow: auto;
      padding: 26px clamp(22px, 5vw, 72px) 50px;
    }

    #editorTitle {
      width: 100%;
      border: 0;
      outline: 0;
      font-size: clamp(26px, 3vw, 38px);
      font-weight: 800;
      color: #111827;
      background: transparent;
      padding: 0;
      margin-bottom: 16px;
    }

    #editorContent {
      width: 100%;
      min-height: calc(100vh - 180px);
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: #1f2937;
      font-size: 17px;
      line-height: 1.65;
      padding: 0;
    }

    .editor-placeholder {
      height: 100%;
      display: grid;
      place-items: center;
      color: #9ca3af;
      text-align: center;
      padding: 24px;
    }

    @media (max-width: 760px) {
      #appShell {
        position: relative;
        overflow: hidden;
      }

      .sidebar, .editor {
        position: absolute;
        inset: 0;
        width: 100%;
        min-width: 0;
        transition: transform .2s ease;
      }

      .sidebar {
        transform: translateX(0);
        z-index: 2;
      }

      .editor {
        transform: translateX(100%);
        z-index: 3;
      }

      #appShell.mobile-editor-open .sidebar {
        transform: translateX(-100%);
      }

      #appShell.mobile-editor-open .editor {
        transform: translateX(0);
      }

      #mobileBackBtn {
        display: inline-block;
      }

      .editor-topbar {
        padding: 10px 16px;
      }

      .editor-body {
        padding: 22px 18px 40px;
      }

      #editorContent {
        min-height: calc(100vh - 170px);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root { color: #f9fafb; background: #111827; }

      body { background: #111827; }

      .login-card,
      #appShell,
      .editor,
      .sidebar {
        background: #111827;
        color: #f9fafb;
      }

      .sidebar {
        background: #161f2d;
      }

      .login-card,
      .sidebar,
      .sidebar-header,
      .search-wrap,
      .editor-topbar,
      .note-item {
        border-color: #2f3a49;
      }

      .login-card input,
      #searchInput {
        background: #0f172a;
        border-color: #475569;
        color: #f9fafb;
      }

      .note-item:hover { background: #1d2939; }
      .note-item.active { background: #20345c; }

      .tool-btn {
        background: #263244;
        color: #dbe3ef;
      }

      .tool-btn.active {
        background: #274472;
        color: #bfdbfe;
      }

      .tool-btn.danger {
        background: #4a1f2a;
        color: #fecdd3;
      }

      #editorTitle,
      #editorContent {
        color: #f9fafb;
      }

      .muted,
      .account-email,
      .signout-link,
      #status,
      #notesStatus,
      #saveStatus,
      .note-preview {
        color: #9ca3af;
      }

      .note-time,
      .editor-placeholder {
        color: #6b7280;
      }
    }
  </style>
</head>
<body>
  <section id="loginPanel">
    <div class="login-card">
      <h1>Simplenote Plus</h1>
      <div class="muted">使用你的 Email 與密碼登入</div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <button class="primary-btn" type="submit">Sign in</button>
      </form>

      <div id="status"></div>
    </div>
  </section>

  <main id="appShell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-row">
          <div class="brand">Simplenote Plus</div>
          <button id="newNoteBtn" class="icon-btn" type="button" title="新增筆記">＋</button>
        </div>

        <div class="account-row">
          <div id="currentEmail" class="account-email"></div>
          <button id="signOutBtn" class="signout-link" type="button">Sign out</button>
        </div>
      </div>

      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜尋筆記…" />
      </div>

      <div id="notesStatus"></div>
      <div id="notesList"></div>
    </aside>

    <section class="editor">
      <div class="editor-topbar">
        <button id="mobileBackBtn" type="button">← 筆記列表</button>
        <div class="editor-tools">
          <button id="pinBtn" class="tool-btn" type="button" style="display:none;">📌 置頂</button>
          <button id="deleteBtn" class="tool-btn danger" type="button" style="display:none;">刪除</button>
          <div id="saveStatus"></div>
        </div>
      </div>

      <div id="editorBody" class="editor-body">
        <div id="editorPlaceholder" class="editor-placeholder">
          <div>
            <div style="font-size:20px;font-weight:700;margin-bottom:8px;">選擇一篇筆記</div>
            <div>或按左上角 ＋ 建立新筆記</div>
          </div>
        </div>

        <div id="editorFields" style="display:none;">
          <input id="editorTitle" type="text" placeholder="標題" />
          <textarea id="editorContent" placeholder="開始寫筆記…"></textarea>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://hsopdjksfetykjwhdpgp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tr9b-wjvVaATe0_nnfu6Sw_dOux8m1h";
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const loginPanel = document.getElementById("loginPanel");
    const appShell = document.getElementById("appShell");
    const loginForm = document.getElementById("loginForm");
    const statusEl = document.getElementById("status");
    const currentEmail = document.getElementById("currentEmail");
    const signOutBtn = document.getElementById("signOutBtn");
    const newNoteBtn = document.getElementById("newNoteBtn");
    const searchInput = document.getElementById("searchInput");
    const notesStatusEl = document.getElementById("notesStatus");
    const notesListEl = document.getElementById("notesList");
    const saveStatusEl = document.getElementById("saveStatus");
    const mobileBackBtn = document.getElementById("mobileBackBtn");
    const pinBtn = document.getElementById("pinBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const editorPlaceholder = document.getElementById("editorPlaceholder");
    const editorFields = document.getElementById("editorFields");
    const editorTitle = document.getElementById("editorTitle");
    const editorContent = document.getElementById("editorContent");

    let notes = [];
    let selectedNoteId = null;
    let saveTimer = null;

    function formatDate(value) {
      if (!value) return "";
      return new Intl.DateTimeFormat("zh-TW", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }

    function currentNote() {
      return notes.find(note => note.id === selectedNoteId) ?? null;
    }

    function sortNotes() {
      notes.sort((a, b) => {
        if (!!a.is_pinned !== !!b.is_pinned) return a.is_pinned ? -1 : 1;
        return new Date(b.updated_at) - new Date(a.updated_at);
      });
    }

    function updateEditorTools(note) {
      if (!note) {
        pinBtn.style.display = "none";
        deleteBtn.style.display = "none";
        return;
      }

      pinBtn.style.display = "inline-block";
      deleteBtn.style.display = "inline-block";
      pinBtn.classList.toggle("active", !!note.is_pinned);
      pinBtn.textContent = note.is_pinned ? "📌 已置頂" : "📌 置頂";
    }

    function showLoggedOut(message = "") {
      clearTimeout(saveTimer);
      notes = [];
      selectedNoteId = null;
      appShell.style.display = "none";
      loginPanel.style.display = "grid";
      statusEl.textContent = message;
    }

    async function showLoggedIn(user) {
      loginPanel.style.display = "none";
      appShell.style.display = "flex";
      currentEmail.textContent = user?.email ?? "";
      await loadNotes();
    }

    function renderNotes() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = notes.filter(note => {
        if (!q) return true;
        return (note.title ?? "").toLowerCase().includes(q) ||
               (note.content ?? "").toLowerCase().includes(q);
      });

      notesListEl.innerHTML = "";

      notesStatusEl.textContent = q ? `${filtered.length} 篇符合` : "";

      if (!filtered.length) {
        notesListEl.innerHTML = '<div class="empty-list">沒有符合的筆記</div>';
        return;
      }

      for (const note of filtered) {
        const item = document.createElement("div");
        item.className = "note-item" + (note.id === selectedNoteId ? " active" : "");

        const title = document.createElement("div");
        title.className = "note-title";
        title.textContent = (note.is_pinned ? "📌 " : "") + (note.title?.trim() || "未命名筆記");

        const preview = document.createElement("div");
        preview.className = "note-preview";
        preview.textContent = note.content?.replace(/\s+/g, " ").trim() || "沒有內容";

        const time = document.createElement("div");
        time.className = "note-time";
        time.textContent = formatDate(note.updated_at);

        item.append(title, preview, time);
        item.addEventListener("click", () => selectNote(note.id));
        notesListEl.appendChild(item);
      }
    }

    function showEditor(note) {
      if (!note) {
        editorPlaceholder.style.display = "grid";
        editorFields.style.display = "none";
        saveStatusEl.textContent = "";
        updateEditorTools(null);
        return;
      }

      editorPlaceholder.style.display = "none";
      editorFields.style.display = "block";
      editorTitle.value = note.title ?? "";
      editorContent.value = note.content ?? "";
      saveStatusEl.textContent = "已載入";
      updateEditorTools(note);
    }

    async function selectNote(id) {
      if (selectedNoteId === id) {
        if (window.innerWidth <= 760) appShell.classList.add("mobile-editor-open");
        return;
      }

      await flushPendingSave();

      selectedNoteId = id;
      renderNotes();
      showEditor(currentNote());

      if (window.innerWidth <= 760) {
        appShell.classList.add("mobile-editor-open");
      }
    }

    async function loadNotes(preferredId = null) {
      notesStatusEl.textContent = "讀取筆記中...";

      const { data, error } = await supabase
        .from("notes")
        .select("id, title, content, is_pinned, created_at, updated_at")
        .order("is_pinned", { ascending: false })
        .order("updated_at", { ascending: false });

      if (error) {
        notesStatusEl.textContent = "讀取失敗：" + error.message;
        return;
      }

      notes = data ?? [];
      sortNotes();
      notesStatusEl.textContent = "";

      if (preferredId && notes.some(n => n.id === preferredId)) {
        selectedNoteId = preferredId;
      } else if (selectedNoteId && !notes.some(n => n.id === selectedNoteId)) {
        selectedNoteId = null;
      } else if (!selectedNoteId && notes.length && window.innerWidth > 760) {
        selectedNoteId = notes[0].id;
      }

      renderNotes();
      showEditor(currentNote());
    }

    async function saveCurrentNote() {
      const note = currentNote();
      if (!note) return;

      const newTitle = editorTitle.value;
      const newContent = editorContent.value;
      const updatedAt = new Date().toISOString();

      saveStatusEl.textContent = "儲存中...";

      const { data, error } = await supabase
        .from("notes")
        .update({
          title: newTitle,
          content: newContent,
          updated_at: updatedAt
        })
        .eq("id", note.id)
        .select("id, title, content, is_pinned, created_at, updated_at")
        .single();

      if (error) {
        saveStatusEl.textContent = "儲存失敗：" + error.message;
        return;
      }

      const index = notes.findIndex(n => n.id === data.id);
      if (index >= 0) notes[index] = data;

      sortNotes();
      renderNotes();
      updateEditorTools(currentNote());
      saveStatusEl.textContent = "已自動儲存";
    }

    function scheduleSave() {
      if (!currentNote()) return;
      saveStatusEl.textContent = "尚未儲存...";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        saveTimer = null;
        await saveCurrentNote();
      }, 700);
    }

    async function flushPendingSave() {
      if (!saveTimer) return;
      clearTimeout(saveTimer);
      saveTimer = null;
      await saveCurrentNote();
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "登入中...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        statusEl.textContent = "登入失敗：" + error.message;
        return;
      }

      statusEl.textContent = "";
      await showLoggedIn(data.user);
    });

    newNoteBtn.addEventListener("click", async () => {
      await flushPendingSave();
      newNoteBtn.disabled = true;
      notesStatusEl.textContent = "建立新筆記中...";

      const { data: { user }, error: userError } = await supabase.auth.getUser();

      if (userError || !user) {
        notesStatusEl.textContent = "找不到登入使用者，請重新登入。";
        newNoteBtn.disabled = false;
        return;
      }

      const { data, error } = await supabase
        .from("notes")
        .insert({
          user_id: user.id,
          title: "",
          content: ""
        })
        .select("id, title, content, is_pinned, created_at, updated_at")
        .single();

      newNoteBtn.disabled = false;

      if (error) {
        notesStatusEl.textContent = "新增失敗：" + error.message;
        return;
      }

      notesStatusEl.textContent = "";
      notes.unshift(data);
      sortNotes();
      selectedNoteId = data.id;
      renderNotes();
      showEditor(data);

      if (window.innerWidth <= 760) {
        appShell.classList.add("mobile-editor-open");
      }

      editorTitle.focus();
    });

    searchInput.addEventListener("input", renderNotes);

    pinBtn.addEventListener("click", async () => {
      await flushPendingSave();
      const note = currentNote();
      if (!note) return;

      pinBtn.disabled = true;
      saveStatusEl.textContent = note.is_pinned ? "取消置頂中..." : "置頂中...";

      const { data, error } = await supabase
        .from("notes")
        .update({ is_pinned: !note.is_pinned })
        .eq("id", note.id)
        .select("id, title, content, is_pinned, created_at, updated_at")
        .single();

      pinBtn.disabled = false;

      if (error) {
        saveStatusEl.textContent = "置頂更新失敗：" + error.message;
        return;
      }

      const index = notes.findIndex(n => n.id === data.id);
      if (index >= 0) notes[index] = data;
      sortNotes();
      renderNotes();
      updateEditorTools(data);
      saveStatusEl.textContent = data.is_pinned ? "已置頂" : "已取消置頂";
    });

    deleteBtn.addEventListener("click", async () => {
      await flushPendingSave();
      const note = currentNote();
      if (!note) return;

      const label = note.title?.trim() || "未命名筆記";
      if (!window.confirm(`確定要刪除「${label}」？此動作無法復原。`)) return;

      deleteBtn.disabled = true;
      saveStatusEl.textContent = "刪除中...";

      const { error } = await supabase
        .from("notes")
        .delete()
        .eq("id", note.id);

      deleteBtn.disabled = false;

      if (error) {
        saveStatusEl.textContent = "刪除失敗：" + error.message;
        return;
      }

      notes = notes.filter(n => n.id !== note.id);
      sortNotes();

      if (window.innerWidth <= 760) {
        selectedNoteId = null;
        appShell.classList.remove("mobile-editor-open");
      } else {
        selectedNoteId = notes[0]?.id ?? null;
      }

      renderNotes();
      showEditor(currentNote());
    });

    editorTitle.addEventListener("input", scheduleSave);
    editorContent.addEventListener("input", scheduleSave);

    mobileBackBtn.addEventListener("click", async () => {
      await flushPendingSave();
      appShell.classList.remove("mobile-editor-open");
      renderNotes();
    });

    signOutBtn.addEventListener("click", async () => {
      await flushPendingSave();
      await supabase.auth.signOut();
      showLoggedOut("已登出。");
    });

    window.addEventListener("beforeunload", () => {
      if (saveTimer) {
        clearTimeout(saveTimer);
        saveTimer = null;
      }
    });

    const { data: { session } } = await supabase.auth.getSession();

    if (session?.user) {
      await showLoggedIn(session.user);
    } else {
      showLoggedOut();
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT" || !session?.user) {
        showLoggedOut(event === "SIGNED_OUT" ? "已登出。" : "");
      }
    });
  </script>
</body>
</html>
