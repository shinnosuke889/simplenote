<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f66e9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Simplenote Plus" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <title>Simplenote Plus</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f5f7fb;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      background: #f5f7fb;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
    }

    #loginPanel {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(92vw, 420px);
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 12px 32px rgba(0,0,0,.06);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .muted {
      color: #6b7280;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 14px;
      font-weight: 650;
    }

    .login-card input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px 14px;
      background: white;
      color: #111827;
    }

    .primary-btn {
      background: #2f66e9;
      color: white;
      border-radius: 10px;
      padding: 11px 15px;
      font-weight: 700;
    }

    .dark-btn {
      background: #111827;
      color: white;
      border-radius: 10px;
      padding: 11px 15px;
      font-weight: 700;
    }

    #loginForm .primary-btn {
      width: 100%;
      margin-top: 18px;
    }

    #status {
      min-height: 20px;
      margin-top: 12px;
      color: #6b7280;
      font-size: 14px;
    }

    #appShell {
      display: none;
      height: 100vh;
      background: white;
    }

    .sidebar {
      width: 330px;
      min-width: 280px;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      background: #fbfcfe;
    }

    .sidebar-header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #2f66e9;
      color: white;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 9px;
    }

    .account-email {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #6b7280;
      font-size: 13px;
    }

    .signout-link {
      background: transparent;
      color: #6b7280;
      font-size: 13px;
      padding: 4px;
    }

    .search-wrap {
      padding: 12px 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    #searchInput {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      background: white;
      color: #111827;
      outline: none;
    }

    #searchInput:focus {
      border-color: #7aa2ff;
      box-shadow: 0 0 0 3px rgba(47,102,233,.10);
    }

    #notesStatus {
      padding: 8px 14px 0;
      min-height: 26px;
      color: #6b7280;
      font-size: 13px;
    }

    #notesList {
      flex: 1;
      overflow: auto;
    }

    .note-item {
      padding: 14px 16px;
      border-bottom: 1px solid #eceff3;
      cursor: pointer;
      background: transparent;
    }

    .note-item:hover {
      background: #f1f5fb;
    }

    .note-item.active {
      background: #eaf1ff;
    }

    .note-title {
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-preview {
      margin-top: 5px;
      font-size: 13px;
      color: #6b7280;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-time {
      margin-top: 5px;
      font-size: 12px;
      color: #9ca3af;
    }

    .empty-list {
      padding: 28px 18px;
      color: #6b7280;
      text-align: center;
      font-size: 14px;
    }

    .editor {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .editor-topbar {
      min-height: 62px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
    }

    #mobileBackBtn {
      display: none;
      background: transparent;
      color: #2f66e9;
      font-weight: 700;
      padding: 8px 0;
    }

    #saveStatus {
      color: #6b7280;
      font-size: 13px;
      text-align: right;
      margin-left: 6px;
      white-space: nowrap;
    }

    .editor-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .tool-btn {
      border-radius: 9px;
      padding: 8px 11px;
      background: #eef2f7;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    .tool-btn.active {
      background: #dbe8ff;
      color: #1d4ed8;
    }

    .tool-btn.danger {
      background: #fff1f2;
      color: #be123c;
    }

    .editor-body {
      flex: 1;
      overflow: auto;
      padding: 26px clamp(22px, 5vw, 72px) 50px;
    }

    #editorTitle {
      width: 100%;
      border: 0;
      outline: 0;
      font-size: clamp(26px, 3vw, 38px);
      font-weight: 800;
      color: #111827;
      background: transparent;
      padding: 0;
      margin-bottom: 16px;
    }

    #editorContent {
      width: 100%;
      min-height: calc(100vh - 180px);
      border: 0;
      outline: 0;
      background: transparent;
      color: #1f2937;
      font-size: 17px;
      line-height: 1.65;
      padding: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #editorContent:empty::before {
      content: attr(data-placeholder);
      color: #9ca3af;
      pointer-events: none;
    }

    #editorContent a {
      color: #2563eb;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    #editorContent img {
      display: block;
      max-width: min(100%, 900px);
      height: auto;
      margin: 14px 0;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    #editorContent img[data-uploading="true"] {
      opacity: .55;
    }

    #editorContent img[data-size="small"] {
      width: min(42%, 360px);
      max-width: 100%;
    }

    #editorContent img[data-size="medium"] {
      width: min(70%, 640px);
      max-width: 100%;
    }

    #editorContent img[data-size="full"] {
      width: 100%;
      max-width: 100%;
    }

    #editorContent img.image-selected {
      outline: 3px solid #2f66e9;
      outline-offset: 3px;
    }

    #imageControls {
      display: none;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    #imageControls.visible {
      display: flex;
    }

    .image-control-label {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    .editor-placeholder {
      height: 100%;
      display: grid;
      place-items: center;
      color: #9ca3af;
      text-align: center;
      padding: 24px;
    }

    @media (max-width: 760px) {
      #appShell {
        position: relative;
        overflow: hidden;
      }

      .sidebar, .editor {
        position: absolute;
        inset: 0;
        width: 100%;
        min-width: 0;
        transition: transform .2s ease;
      }

      .sidebar {
        transform: translateX(0);
        z-index: 2;
      }

      .editor {
        transform: translateX(100%);
        z-index: 3;
      }

      #appShell.mobile-editor-open .sidebar {
        transform: translateX(-100%);
      }

      #appShell.mobile-editor-open .editor {
        transform: translateX(0);
      }

      #mobileBackBtn {
        display: inline-block;
      }

      .editor-topbar {
        padding: 10px 16px;
        flex-wrap: wrap;
      }

      .editor-tools {
        gap: 5px;
      }

      .tool-btn {
        padding: 7px 9px;
      }

      #saveStatus {
        font-size: 12px;
      }

      .editor-body {
        padding: 22px 18px 40px;
      }

      #editorContent {
        min-height: calc(100vh - 170px);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root { color: #f9fafb; background: #111827; }

      body { background: #111827; }

      .login-card,
      #appShell,
      .editor,
      .sidebar {
        background: #111827;
        color: #f9fafb;
      }

      .sidebar {
        background: #161f2d;
      }

      .login-card,
      .sidebar,
      .sidebar-header,
      .search-wrap,
      .editor-topbar,
      .note-item {
        border-color: #2f3a49;
      }

      .login-card input,
      #searchInput {
        background: #0f172a;
        border-color: #475569;
        color: #f9fafb;
      }

      .note-item:hover { background: #1d2939; }
      .note-item.active { background: #20345c; }

      .tool-btn {
        background: #263244;
        color: #dbe3ef;
      }

      .tool-btn.active {
        background: #274472;
        color: #bfdbfe;
      }

      .tool-btn.danger {
        background: #4a1f2a;
        color: #fecdd3;
      }

      #editorTitle,
      #editorContent {
        color: #f9fafb;
      }

      #editorContent a {
        color: #93c5fd;
      }

      .muted,
      .account-email,
      .signout-link,
      #status,
      #notesStatus,
      #saveStatus,
      .note-preview {
        color: #9ca3af;
      }

      .note-time,
      .editor-placeholder {
        color: #6b7280;
      }
    }
  </style>
</head>
<body>
  <section id="loginPanel">
    <div class="login-card">
      <h1>Simplenote Plus</h1>
      <div class="muted">使用你的 Email 與密碼登入</div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <button class="primary-btn" type="submit">Sign in</button>
      </form>

      <div id="status"></div>
    </div>
  </section>

  <main id="appShell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-row">
          <div class="brand">Simplenote Plus</div>
          <button id="newNoteBtn" class="icon-btn" type="button" title="新增筆記">＋</button>
        </div>

        <div class="account-row">
          <div id="currentEmail" class="account-email"></div>
          <button id="signOutBtn" class="signout-link" type="button">Sign out</button>
        </div>
      </div>

      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜尋筆記…" />
      </div>

      <div id="notesStatus"></div>
      <div id="notesList"></div>
    </aside>

    <section class="editor">
      <div class="editor-topbar">
        <button id="mobileBackBtn" type="button">← 筆記列表</button>
        <div class="editor-tools">
          <div id="imageControls">
            <span class="image-control-label">圖片</span>
            <button id="imageSmallBtn" class="tool-btn" type="button">小</button>
            <button id="imageMediumBtn" class="tool-btn" type="button">中</button>
            <button id="imageFullBtn" class="tool-btn" type="button">滿寬</button>
            <button id="imageDeleteBtn" class="tool-btn danger" type="button">刪圖</button>
          </div>
          <button id="imageBtn" class="tool-btn" type="button" style="display:none;" title="插入圖片">🖼️</button>
          <button id="pinBtn" class="tool-btn" type="button" style="display:none;">📌 置頂</button>
          <button id="deleteBtn" class="tool-btn danger" type="button" style="display:none;">刪除</button>
          <div id="saveStatus"></div>
        </div>
        <input id="imageInput" type="file" accept="image/*" multiple hidden />
      </div>

      <div id="editorBody" class="editor-body">
        <div id="editorPlaceholder" class="editor-placeholder">
          <div>
            <div style="font-size:20px;font-weight:700;margin-bottom:8px;">選擇一篇筆記</div>
            <div>或按左上角 ＋ 建立新筆記</div>
          </div>
        </div>

        <div id="editorFields" style="display:none;">
          <input id="editorTitle" type="text" placeholder="標題" />
          <div id="editorContent" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="開始寫筆記…"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://hsopdjksfetykjwhdpgp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tr9b-wjvVaATe0_nnfu6Sw_dOux8m1h";
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const loginPanel = document.getElementById("loginPanel");
    const appShell = document.getElementById("appShell");
    const loginForm = document.getElementById("loginForm");
    const statusEl = document.getElementById("status");
    const currentEmail = document.getElementById("currentEmail");
    const signOutBtn = document.getElementById("signOutBtn");
    const newNoteBtn = document.getElementById("newNoteBtn");
    const searchInput = document.getElementById("searchInput");
    const notesStatusEl = document.getElementById("notesStatus");
    const notesListEl = document.getElementById("notesList");
    const saveStatusEl = document.getElementById("saveStatus");
    const mobileBackBtn = document.getElementById("mobileBackBtn");
    const imageControls = document.getElementById("imageControls");
    const imageSmallBtn = document.getElementById("imageSmallBtn");
    const imageMediumBtn = document.getElementById("imageMediumBtn");
    const imageFullBtn = document.getElementById("imageFullBtn");
    const imageDeleteBtn = document.getElementById("imageDeleteBtn");
    const imageBtn = document.getElementById("imageBtn");
    const imageInput = document.getElementById("imageInput");
    const pinBtn = document.getElementById("pinBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const editorPlaceholder = document.getElementById("editorPlaceholder");
    const editorFields = document.getElementById("editorFields");
    const editorTitle = document.getElementById("editorTitle");
    const editorContent = document.getElementById("editorContent");

    let notes = [];
    let selectedNoteId = null;
    let saveTimer = null;
    let savePromise = null;
    let editorDirty = false;
    let realtimeChannel = null;
    let currentUserId = null;
    let refreshInProgress = false;
    let savedEditorRange = null;
    let skipNextEditorBlur = false;
    let selectedImage = null;

    const RICH_PREFIX = "<!--sp-rich-v1-->";
    const MEDIA_BUCKET = "note-media";

    function escapeHtml(value = "") {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function safeHttpUrl(value = "") {
      try {
        const url = new URL(value);
        return (url.protocol === "http:" || url.protocol === "https:") ? url.href : null;
      } catch {
        return null;
      }
    }

    function safeStoragePath(value = "") {
      if (!value || value.includes("..") || value.startsWith("/") || value.includes("\\")) return null;
      if (!currentUserId) return null;
      return value.startsWith(currentUserId + "/") ? value : null;
    }

    function storagePathsFromStoredContent(content = "") {
      const normalized = normalizeStoredContent(content);
      if (!normalized.startsWith(RICH_PREFIX)) return [];

      const template = document.createElement("template");
      template.innerHTML = normalized.slice(RICH_PREFIX.length);

      return Array.from(template.content.querySelectorAll("img[data-storage-path]"))
        .map(img => safeStoragePath(img.getAttribute("data-storage-path") ?? ""))
        .filter(Boolean);
    }

    async function signedUrlForPath(path) {
      const safePath = safeStoragePath(path);
      if (!safePath) return null;

      const { data, error } = await supabase.storage
        .from(MEDIA_BUCKET)
        .createSignedUrl(safePath, 3600);

      if (error) return null;
      return data?.signedUrl ?? null;
    }

    async function hydrateStorageImages(root) {
      const images = Array.from(root.querySelectorAll("img[data-storage-path]"));

      await Promise.all(images.map(async img => {
        const path = img.getAttribute("data-storage-path") ?? "";
        const signedUrl = await signedUrlForPath(path);

        if (signedUrl) {
          img.src = signedUrl;
          img.removeAttribute("data-uploading");
        }
      }));
    }

    function linkifyPlainText(value = "") {
      const urlRegex = /https?:\/\/[^\s<>"']+/gi;
      let result = "";
      let lastIndex = 0;

      for (const match of value.matchAll(urlRegex)) {
        const raw = match[0];
        const href = safeHttpUrl(raw);
        result += escapeHtml(value.slice(lastIndex, match.index));

        if (href) {
          result += `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" contenteditable="false">${escapeHtml(raw)}</a>`;
        } else {
          result += escapeHtml(raw);
        }

        lastIndex = match.index + raw.length;
      }

      result += escapeHtml(value.slice(lastIndex));
      return result;
    }

    function serializeRichNode(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        return linkifyPlainText(node.nodeValue ?? "");
      }

      if (node.nodeType !== Node.ELEMENT_NODE) return "";

      const tag = node.tagName.toLowerCase();

      if (tag === "br") return "<br>";

      if (tag === "a") {
        const rawHref = node.getAttribute("href") ?? node.textContent ?? "";
        const href = safeHttpUrl(rawHref);
        const label = node.textContent ?? rawHref;

        if (!href) return linkifyPlainText(label);

        return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" contenteditable="false">${escapeHtml(label)}</a>`;
      }

      if (tag === "img") {
        const path = safeStoragePath(node.getAttribute("data-storage-path") ?? "");
        const alt = escapeHtml(node.getAttribute("alt") ?? "");
        const size = ["small", "medium", "full"].includes(node.getAttribute("data-size"))
          ? node.getAttribute("data-size")
          : "";
        const sizeAttr = size ? ` data-size="${size}"` : "";

        if (path) {
          return `<img data-storage-path="${escapeHtml(path)}"${sizeAttr} alt="${alt}">`;
        }

        const src = safeHttpUrl(node.getAttribute("src") ?? "");
        if (!src) return "";
        return `<img src="${escapeHtml(src)}"${sizeAttr} alt="${alt}">`;
      }

      const children = Array.from(node.childNodes).map(serializeRichNode).join("");

      if (tag === "div" || tag === "p") {
        return `<div>${children || "<br>"}</div>`;
      }

      return children;
    }

    function sanitizeRichHtml(html = "") {
      const template = document.createElement("template");
      template.innerHTML = html;
      return Array.from(template.content.childNodes).map(serializeRichNode).join("");
    }

    function decodeHtmlEntities(value = "") {
      const textarea = document.createElement("textarea");
      textarea.innerHTML = value;
      return textarea.value;
    }

    function normalizeStoredContent(content = "") {
      let current = content ?? "";

      // 修復舊分頁/舊版本曾把 rich HTML 當純文字再存回資料庫的情況。
      // 最多拆 4 層，避免異常資料造成無限迴圈。
      for (let i = 0; i < 4; i++) {
        if (!current.startsWith(RICH_PREFIX)) return current;

        const inner = current.slice(RICH_PREFIX.length);
        const template = document.createElement("template");
        template.innerHTML = inner;

        const visibleText = (template.content.textContent ?? "").trimStart();
        if (visibleText.startsWith(RICH_PREFIX)) {
          current = visibleText;
          continue;
        }

        const decoded = decodeHtmlEntities(inner).trimStart();
        if (decoded.startsWith(RICH_PREFIX)) {
          current = decoded;
          continue;
        }

        return current;
      }

      return current;
    }

    function storedContentToHtml(content = "") {
      const normalized = normalizeStoredContent(content);

      if (normalized.startsWith(RICH_PREFIX)) {
        return sanitizeRichHtml(normalized.slice(RICH_PREFIX.length));
      }

      // 舊版純文字筆記相容：安全 escape 後，自動把 URL 變成連結。
      return linkifyPlainText(normalized).replaceAll("\n", "<br>");
    }

    function serializeEditorContent() {
      const html = Array.from(editorContent.childNodes).map(serializeRichNode).join("");
      return RICH_PREFIX + html;
    }

    function plainTextFromStoredContent(content = "") {
      const normalized = normalizeStoredContent(content);
      if (!normalized.startsWith(RICH_PREFIX)) return normalized;

      const template = document.createElement("template");
      template.innerHTML = sanitizeRichHtml(normalized.slice(RICH_PREFIX.length));

      function textOf(node) {
        if (node.nodeType === Node.TEXT_NODE) return node.nodeValue ?? "";
        if (node.nodeType !== Node.ELEMENT_NODE) return "";

        const tag = node.tagName.toLowerCase();
        if (tag === "br") return "\n";
        if (tag === "img") return " [圖片] ";

        const text = Array.from(node.childNodes).map(textOf).join("");
        return (tag === "div" || tag === "p") ? text + "\n" : text;
      }

      return Array.from(template.content.childNodes).map(textOf).join("").replace(/\n+$/g, "");
    }

    function insertPlainTextAtSelection(text) {
      const selection = window.getSelection();
      if (!selection?.rangeCount) return;

      const range = selection.getRangeAt(0);
      range.deleteContents();

      const node = document.createTextNode(text);
      range.insertNode(node);
      range.setStartAfter(node);
      range.collapse(true);

      selection.removeAllRanges();
      selection.addRange(range);
    }

    function linkifyCurrentTextNode() {
      const selection = window.getSelection();
      if (!selection?.rangeCount) return;

      const node = selection.anchorNode;
      if (!node || node.nodeType !== Node.TEXT_NODE || !editorContent.contains(node)) return;
      if (node.parentElement?.closest("a")) return;

      const text = node.nodeValue ?? "";
      if (!/https?:\/\/[^\s]+/i.test(text)) return;

      const caretOffset = selection.anchorOffset;
      const beforeCaret = text.slice(0, caretOffset);
      const linkedBeforeCaret = linkifyPlainText(beforeCaret);
      const linkedAfterCaret = linkifyPlainText(text.slice(caretOffset));

      const holder = document.createElement("span");
      holder.innerHTML = linkedBeforeCaret + linkedAfterCaret;

      const fragment = document.createDocumentFragment();
      const nodes = Array.from(holder.childNodes);
      nodes.forEach(child => fragment.appendChild(child));

      node.parentNode.replaceChild(fragment, node);

      // 將游標移到剛轉換片段的末端；URL 通常在按 Space / Enter 時完成轉換。
      const parent = editorContent;
      const newSelection = window.getSelection();
      const newRange = document.createRange();
      newRange.selectNodeContents(parent);
      newRange.collapse(false);
      newSelection.removeAllRanges();
      newSelection.addRange(newRange);
    }

    function currentEditorRange() {
      const selection = window.getSelection();
      if (!selection?.rangeCount) return null;

      const range = selection.getRangeAt(0);
      const node = range.commonAncestorContainer;

      if (editorContent.contains(node) || node === editorContent) {
        return range.cloneRange();
      }

      return null;
    }

    function captureEditorRange() {
      const range = currentEditorRange();
      if (range) savedEditorRange = range;
    }

    function validEditorRange(range) {
      if (!range) return false;

      try {
        const node = range.commonAncestorContainer;
        return node === editorContent || editorContent.contains(node);
      } catch {
        return false;
      }
    }

    function insertImageNode(img, insertionRange = null) {
      editorContent.focus();

      let range = validEditorRange(insertionRange)
        ? insertionRange.cloneRange()
        : (validEditorRange(savedEditorRange) ? savedEditorRange.cloneRange() : null);

      const wrapper = document.createElement("div");
      wrapper.appendChild(img);
      wrapper.appendChild(document.createElement("br"));

      if (!range) {
        editorContent.appendChild(wrapper);
        range = document.createRange();
        range.setStartAfter(wrapper);
        range.collapse(true);
      } else {
        range.deleteContents();
        range.insertNode(wrapper);

        const afterImage = document.createRange();
        afterImage.setStartAfter(wrapper);
        afterImage.collapse(true);
        range = afterImage;
      }

      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      savedEditorRange = range.cloneRange();
      scheduleSave();

      // Return the new insertion point so multiple pasted images stay in order.
      return range.cloneRange();
    }

    function fileExtension(file) {
      const namePart = (file.name ?? "").split(".").pop()?.toLowerCase() ?? "";
      if (/^[a-z0-9]{1,8}$/.test(namePart) && namePart !== file.name?.toLowerCase()) return namePart;

      const subtype = (file.type ?? "").split("/")[1]?.toLowerCase() ?? "img";
      return subtype.replace(/[^a-z0-9]/g, "") || "img";
    }

    async function uploadImageFile(file, insertionRange = null) {
      const note = currentNote();
      if (!note || !currentUserId) return;

      if (!file.type?.startsWith("image/")) {
        saveStatusEl.textContent = "只能上傳圖片";
        return;
      }

      if (file.size > 20 * 1024 * 1024) {
        saveStatusEl.textContent = "圖片超過 20 MB";
        return;
      }

      const ext = fileExtension(file);
      const path = `${currentUserId}/${note.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;

      saveStatusEl.textContent = "圖片上傳中...";

      const { error } = await supabase.storage
        .from(MEDIA_BUCKET)
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

      if (error) {
        saveStatusEl.textContent = "圖片上傳失敗：" + error.message;
        return;
      }

      const img = document.createElement("img");
      img.setAttribute("data-storage-path", path);
      img.setAttribute("data-size", "medium");
      img.setAttribute("data-uploading", "true");
      img.alt = file.name || "圖片";
      img.contentEditable = "false";

      const signedUrl = await signedUrlForPath(path);
      if (signedUrl) {
        img.src = signedUrl;
        img.removeAttribute("data-uploading");
      }

      const nextRange = insertImageNode(img, insertionRange);
      saveStatusEl.textContent = "圖片已插入，等待儲存...";
      return nextRange;
    }

    function formatDate(value) {
      if (!value) return "";
      return new Intl.DateTimeFormat("zh-TW", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }

    function currentNote() {
      return notes.find(note => note.id === selectedNoteId) ?? null;
    }

    function sortNotes() {
      notes.sort((a, b) => {
        if (!!a.is_pinned !== !!b.is_pinned) return a.is_pinned ? -1 : 1;
        return new Date(b.updated_at) - new Date(a.updated_at);
      });
    }

    function clearImageSelection() {
      if (selectedImage) {
        selectedImage.classList.remove("image-selected");
      }
      selectedImage = null;
      imageControls.classList.remove("visible");
    }

    function selectImage(img) {
      clearImageSelection();
      selectedImage = img;
      selectedImage.classList.add("image-selected");
      imageControls.classList.add("visible");

      const size = img.getAttribute("data-size") || "medium";
      imageSmallBtn.classList.toggle("active", size === "small");
      imageMediumBtn.classList.toggle("active", size === "medium");
      imageFullBtn.classList.toggle("active", size === "full");
    }

    function setSelectedImageSize(size) {
      if (!selectedImage || !["small", "medium", "full"].includes(size)) return;
      selectedImage.setAttribute("data-size", size);
      selectImage(selectedImage);
      scheduleSave();
    }

    function removeSelectedImage() {
      if (!selectedImage) return;

      const img = selectedImage;
      const parent = img.parentElement;

      clearImageSelection();

      if (parent && parent.tagName === "DIV") {
        const meaningfulChildren = Array.from(parent.childNodes).filter(node => {
          if (node.nodeType === Node.TEXT_NODE) return (node.nodeValue ?? "").trim() !== "";
          if (node.nodeType !== Node.ELEMENT_NODE) return false;
          return node.tagName.toLowerCase() !== "br";
        });

        if (meaningfulChildren.length === 1 && meaningfulChildren[0] === img) {
          parent.remove();
        } else {
          img.remove();
        }
      } else {
        img.remove();
      }

      scheduleSave();
    }

    function updateEditorTools(note) {
      if (!note) {
        imageBtn.style.display = "none";
        pinBtn.style.display = "none";
        deleteBtn.style.display = "none";
        return;
      }

      imageBtn.style.display = "inline-block";
      pinBtn.style.display = "inline-block";
      deleteBtn.style.display = "inline-block";
      pinBtn.classList.toggle("active", !!note.is_pinned);
      pinBtn.textContent = note.is_pinned ? "📌 已置頂" : "📌 置頂";
    }

    function stopRealtime() {
      if (realtimeChannel) {
        supabase.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }
    }

    function showLoggedOut(message = "") {
      clearTimeout(saveTimer);
      stopRealtime();
      notes = [];
      selectedNoteId = null;
      editorDirty = false;
      currentUserId = null;
      appShell.style.display = "none";
      loginPanel.style.display = "grid";
      statusEl.textContent = message;
    }

    async function showLoggedIn(user) {
      loginPanel.style.display = "none";
      appShell.style.display = "flex";
      currentEmail.textContent = user?.email ?? "";
      currentUserId = user?.id ?? null;
      await loadNotes();
      startRealtime();
    }

    function renderNotes() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = notes.filter(note => {
        if (!q) return true;
        return (note.title ?? "").toLowerCase().includes(q) ||
               plainTextFromStoredContent(note.content ?? "").toLowerCase().includes(q);
      });

      notesListEl.innerHTML = "";

      notesStatusEl.textContent = q ? `${filtered.length} 篇符合` : "";

      if (!filtered.length) {
        notesListEl.innerHTML = '<div class="empty-list">沒有符合的筆記</div>';
        return;
      }

      for (const note of filtered) {
        const item = document.createElement("div");
        item.className = "note-item" + (note.id === selectedNoteId ? " active" : "");

        const title = document.createElement("div");
        title.className = "note-title";
        title.textContent = (note.is_pinned ? "📌 " : "") + (note.title?.trim() || "未命名筆記");

        const preview = document.createElement("div");
        preview.className = "note-preview";
        preview.textContent = plainTextFromStoredContent(note.content ?? "").replace(/\s+/g, " ").trim() || "沒有內容";

        const time = document.createElement("div");
        time.className = "note-time";
        time.textContent = formatDate(note.updated_at);

        item.append(title, preview, time);
        item.addEventListener("click", () => selectNote(note.id));
        notesListEl.appendChild(item);
      }
    }

    function showEditor(note) {
      clearImageSelection();

      if (!note) {
        editorPlaceholder.style.display = "grid";
        editorFields.style.display = "none";
        saveStatusEl.textContent = "";
        updateEditorTools(null);
        return;
      }

      editorPlaceholder.style.display = "none";
      editorFields.style.display = "block";
      editorTitle.value = note.title ?? "";
      editorContent.innerHTML = storedContentToHtml(note.content ?? "");
      hydrateStorageImages(editorContent);
      editorDirty = false;
      saveStatusEl.textContent = "已載入";
      updateEditorTools(note);
    }

    async function selectNote(id) {
      if (selectedNoteId === id) {
        if (window.innerWidth <= 760) appShell.classList.add("mobile-editor-open");
        return;
      }

      await flushPendingSave();

      selectedNoteId = id;
      renderNotes();
      showEditor(currentNote());

      if (window.innerWidth <= 760) {
        appShell.classList.add("mobile-editor-open");
      }
    }

    async function loadNotes(preferredId = null) {
      notesStatusEl.textContent = "讀取筆記中...";

      const { data, error } = await supabase
        .from("notes")
        .select("id, title, content, is_pinned, created_at, updated_at")
        .order("is_pinned", { ascending: false })
        .order("updated_at", { ascending: false });

      if (error) {
        notesStatusEl.textContent = "讀取失敗：" + error.message;
        return;
      }

      const repairs = [];
      notes = (data ?? []).map(note => {
        const normalized = normalizeStoredContent(note.content ?? "");

        if (normalized !== (note.content ?? "")) {
          repairs.push({ id: note.id, content: normalized });
          return { ...note, content: normalized };
        }

        return note;
      });

      // 若之前曾被舊版頁面把 rich HTML 當成文字存回，這裡會自動修回正常格式。
      if (repairs.length) {
        Promise.all(
          repairs.map(item =>
            supabase
              .from("notes")
              .update({ content: item.content })
              .eq("id", item.id)
          )
        ).catch(() => {});
      }

      sortNotes();
      notesStatusEl.textContent = "";

      if (preferredId && notes.some(n => n.id === preferredId)) {
        selectedNoteId = preferredId;
      } else if (selectedNoteId && !notes.some(n => n.id === selectedNoteId)) {
        selectedNoteId = null;
      } else if (!selectedNoteId && notes.length && window.innerWidth > 760) {
        selectedNoteId = notes[0].id;
      }

      renderNotes();
      showEditor(currentNote());
    }

    async function saveCurrentNote() {
      const note = currentNote();
      if (!note || !editorDirty) return;

      if (savePromise) {
        await savePromise;
        if (!editorDirty) return;
      }

      const noteId = note.id;
      const titleSnapshot = editorTitle.value;
      const contentSnapshot = serializeEditorContent();
      const oldMediaPaths = storagePathsFromStoredContent(note.content ?? "");
      const newMediaPaths = storagePathsFromStoredContent(contentSnapshot);
      const removedMediaPaths = oldMediaPaths.filter(path => !newMediaPaths.includes(path));
      const updatedAt = new Date().toISOString();

      saveStatusEl.textContent = "儲存中...";

      savePromise = (async () => {
        const { data, error } = await supabase
          .from("notes")
          .update({
            title: titleSnapshot,
            content: contentSnapshot,
            updated_at: updatedAt
          })
          .eq("id", noteId)
          .select("id, title, content, is_pinned, created_at, updated_at")
          .single();

        if (error) {
          saveStatusEl.textContent = "儲存失敗：" + error.message;
          return;
        }

        const index = notes.findIndex(n => n.id === data.id);
        if (index >= 0) notes[index] = data;

        if (removedMediaPaths.length) {
          supabase.storage.from(MEDIA_BUCKET).remove(removedMediaPaths).catch(() => {});
        }

        editorDirty =
          selectedNoteId === noteId &&
          (editorTitle.value !== titleSnapshot || serializeEditorContent() !== contentSnapshot);

        sortNotes();
        renderNotes();
        updateEditorTools(currentNote());
        saveStatusEl.textContent = editorDirty ? "尚未儲存..." : "已自動儲存";
      })();

      try {
        await savePromise;
      } finally {
        savePromise = null;
      }
    }

    function scheduleSave() {
      if (!currentNote()) return;
      editorDirty = true;
      saveStatusEl.textContent = "尚未儲存...";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        saveTimer = null;
        await saveCurrentNote();
      }, 700);
    }

    async function flushPendingSave() {
      if (saveTimer) {
        clearTimeout(saveTimer);
        saveTimer = null;
      }

      if (editorDirty) {
        await saveCurrentNote();
      } else if (savePromise) {
        await savePromise;
      }
    }

    function applyRealtimeChange(payload) {
      const type = payload.eventType;

      if (type === "INSERT") {
        const incoming = payload.new;
        if (!incoming?.id || notes.some(n => n.id === incoming.id)) return;
        notes.push(incoming);
        sortNotes();

        if (!selectedNoteId && window.innerWidth > 760) {
          selectedNoteId = incoming.id;
          showEditor(incoming);
        }

        renderNotes();
        return;
      }

      if (type === "UPDATE") {
        const incoming = payload.new;
        if (!incoming?.id) return;

        const index = notes.findIndex(n => n.id === incoming.id);
        if (index >= 0) {
          notes[index] = incoming;
        } else {
          notes.push(incoming);
        }

        sortNotes();
        renderNotes();

        if (selectedNoteId === incoming.id && !editorDirty && !savePromise) {
          editorTitle.value = incoming.title ?? "";
          editorContent.innerHTML = storedContentToHtml(incoming.content ?? "");
          hydrateStorageImages(editorContent);
          updateEditorTools(incoming);
          saveStatusEl.textContent = "已同步";
        }
        return;
      }

      if (type === "DELETE") {
        const deletedId = payload.old?.id;
        if (!deletedId) return;

        notes = notes.filter(n => n.id !== deletedId);

        if (selectedNoteId === deletedId) {
          clearTimeout(saveTimer);
          saveTimer = null;
          editorDirty = false;

          if (window.innerWidth <= 760) {
            selectedNoteId = null;
            appShell.classList.remove("mobile-editor-open");
          } else {
            sortNotes();
            selectedNoteId = notes[0]?.id ?? null;
          }

          showEditor(currentNote());
        }

        sortNotes();
        renderNotes();
      }
    }

    function startRealtime() {
      stopRealtime();
      if (!currentUserId) return;

      realtimeChannel = supabase
        .channel("notes-sync-" + currentUserId)
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "notes",
            filter: `user_id=eq.${currentUserId}`
          },
          applyRealtimeChange
        )
        .subscribe();
    }

    async function refreshFromServer(reason = "") {
      if (!currentUserId || refreshInProgress || document.hidden) return;

      refreshInProgress = true;
      const keepSelectedId = selectedNoteId;

      try {
        await flushPendingSave();
        await loadNotes(keepSelectedId);

        if (reason && currentNote()) {
          saveStatusEl.textContent = "已同步";
        }
      } finally {
        refreshInProgress = false;
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "登入中...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        statusEl.textContent = "登入失敗：" + error.message;
        return;
      }

      statusEl.textContent = "";
      await showLoggedIn(data.user);
    });

    newNoteBtn.addEventListener("click", async () => {
      await flushPendingSave();
      newNoteBtn.disabled = true;
      notesStatusEl.textContent = "建立新筆記中...";

      const { data: { user }, error: userError } = await supabase.auth.getUser();

      if (userError || !user) {
        notesStatusEl.textContent = "找不到登入使用者，請重新登入。";
        newNoteBtn.disabled = false;
        return;
      }

      const { data, error } = await supabase
        .from("notes")
        .insert({
          user_id: user.id,
          title: "",
          content: ""
        })
        .select("id, title, content, is_pinned, created_at, updated_at")
        .single();

      newNoteBtn.disabled = false;

      if (error) {
        notesStatusEl.textContent = "新增失敗：" + error.message;
        return;
      }

      notesStatusEl.textContent = "";
      notes.unshift(data);
      sortNotes();
      selectedNoteId = data.id;
      renderNotes();
      showEditor(data);

      if (window.innerWidth <= 760) {
        appShell.classList.add("mobile-editor-open");
      }

      editorTitle.focus();
    });

    searchInput.addEventListener("input", renderNotes);

    imageBtn.addEventListener("mousedown", () => {
      captureEditorRange();
      skipNextEditorBlur = true;
    });

    imageBtn.addEventListener("click", () => {
      if (!currentNote()) return;
      imageInput.click();
    });

    imageInput.addEventListener("change", async () => {
      const files = Array.from(imageInput.files ?? []);
      imageInput.value = "";

      let insertionRange = validEditorRange(savedEditorRange)
        ? savedEditorRange.cloneRange()
        : null;

      for (const file of files) {
        insertionRange = await uploadImageFile(file, insertionRange) ?? insertionRange;
      }
    });

    // 點圖片控制列時，contenteditable 會先觸發 blur。
    // 這裡先標記，避免 blur 重建 DOM，否則 selectedImage 會指向已被替換的舊節點。
    imageControls.addEventListener("mousedown", () => {
      skipNextEditorBlur = true;
    });

    imageControls.addEventListener("touchstart", () => {
      skipNextEditorBlur = true;
    }, { passive: true });

    imageSmallBtn.addEventListener("click", () => setSelectedImageSize("small"));
    imageMediumBtn.addEventListener("click", () => setSelectedImageSize("medium"));
    imageFullBtn.addEventListener("click", () => setSelectedImageSize("full"));
    imageDeleteBtn.addEventListener("click", removeSelectedImage);

    pinBtn.addEventListener("click", async () => {
      await flushPendingSave();
      const note = currentNote();
      if (!note) return;

      pinBtn.disabled = true;
      saveStatusEl.textContent = note.is_pinned ? "取消置頂中..." : "置頂中...";

      const { data, error } = await supabase
        .from("notes")
        .update({ is_pinned: !note.is_pinned })
        .eq("id", note.id)
        .select("id, title, content, is_pinned, created_at, updated_at")
        .single();

      pinBtn.disabled = false;

      if (error) {
        saveStatusEl.textContent = "置頂更新失敗：" + error.message;
        return;
      }

      const index = notes.findIndex(n => n.id === data.id);
      if (index >= 0) notes[index] = data;
      sortNotes();
      renderNotes();
      updateEditorTools(data);
      saveStatusEl.textContent = data.is_pinned ? "已置頂" : "已取消置頂";
    });

    deleteBtn.addEventListener("click", async () => {
      await flushPendingSave();
      const note = currentNote();
      if (!note) return;

      const label = note.title?.trim() || "未命名筆記";
      if (!window.confirm(`確定要刪除「${label}」？此動作無法復原。`)) return;

      const mediaPaths = storagePathsFromStoredContent(note.content ?? "");

      deleteBtn.disabled = true;
      saveStatusEl.textContent = "刪除中...";

      const { error } = await supabase
        .from("notes")
        .delete()
        .eq("id", note.id);

      deleteBtn.disabled = false;

      if (error) {
        saveStatusEl.textContent = "刪除失敗：" + error.message;
        return;
      }

      if (mediaPaths.length) {
        supabase.storage.from(MEDIA_BUCKET).remove(mediaPaths).catch(() => {});
      }

      notes = notes.filter(n => n.id !== note.id);
      sortNotes();

      if (window.innerWidth <= 760) {
        selectedNoteId = null;
        appShell.classList.remove("mobile-editor-open");
      } else {
        selectedNoteId = notes[0]?.id ?? null;
      }

      renderNotes();
      showEditor(currentNote());
    });

    editorTitle.addEventListener("input", scheduleSave);
    editorContent.addEventListener("input", scheduleSave);

    editorContent.addEventListener("paste", async (event) => {
      const files = Array.from(event.clipboardData?.files ?? [])
        .filter(file => file.type?.startsWith("image/"));

      if (files.length) {
        event.preventDefault();

        let insertionRange = currentEditorRange();
        if (insertionRange) savedEditorRange = insertionRange.cloneRange();

        for (const file of files) {
          insertionRange = await uploadImageFile(file, insertionRange) ?? insertionRange;
        }

        return;
      }

      event.preventDefault();
      const text = event.clipboardData?.getData("text/plain") ?? "";
      insertPlainTextAtSelection(text);
      scheduleSave();
    });

    document.addEventListener("selectionchange", () => {
      captureEditorRange();
    });

    editorContent.addEventListener("mouseup", captureEditorRange);
    editorContent.addEventListener("touchend", captureEditorRange);

    editorContent.addEventListener("keyup", (event) => {
      if (event.key === "Escape") {
        clearImageSelection();
        return;
      }

      if (event.key === " " || event.key === "Enter") {
        linkifyCurrentTextNode();
      }
    });

    editorContent.addEventListener("blur", () => {
      if (skipNextEditorBlur) {
        skipNextEditorBlur = false;
        return;
      }

      // 離開編輯器時，用目前內容重新渲染一次，確保裸 URL 都成為連結。
      if (!currentNote()) return;
      const stored = serializeEditorContent();
      editorContent.innerHTML = storedContentToHtml(stored);
      hydrateStorageImages(editorContent);
    });

    editorContent.addEventListener("click", (event) => {
      const image = event.target.closest?.("img");
      if (image && editorContent.contains(image)) {
        event.preventDefault();
        selectImage(image);
        return;
      }

      clearImageSelection();

      const link = event.target.closest?.("a");
      if (!link) return;

      const href = safeHttpUrl(link.getAttribute("href") ?? "");
      if (!href) return;

      event.preventDefault();
      window.open(href, "_blank", "noopener,noreferrer");
    });

    mobileBackBtn.addEventListener("click", async () => {
      await flushPendingSave();
      appShell.classList.remove("mobile-editor-open");
      renderNotes();
    });

    signOutBtn.addEventListener("click", async () => {
      await flushPendingSave();
      await supabase.auth.signOut();
      showLoggedOut("已登出。");
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        refreshFromServer("foreground");
      }
    });

    window.addEventListener("focus", () => {
      refreshFromServer("focus");
    });

    window.addEventListener("online", () => {
      refreshFromServer("online");
    });

    window.addEventListener("beforeunload", () => {
      if (saveTimer) {
        clearTimeout(saveTimer);
        saveTimer = null;
      }
    });

    // PWA：僅提供安裝 / standalone 外觀，不快取筆記或 Supabase 資料，
    // 避免離線快取造成舊版程式或同步衝突。
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("./sw.js", { scope: "./", updateViaCache: "none" })
        .catch(error => console.warn("Service worker registration failed:", error));
    }

    const { data: { session } } = await supabase.auth.getSession();

    if (session?.user) {
      await showLoggedIn(session.user);
    } else {
      showLoggedOut();
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT" || !session?.user) {
        showLoggedOut(event === "SIGNED_OUT" ? "已登出。" : "");
      }
    });
  </script>
</body>
</html>
