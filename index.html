<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simplenote Plus</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f7f9;
      color: #1f2937;
    }

    .card {
      width: min(92vw, 380px);
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .sub {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      color: #111827;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button.secondary {
      background: #111827;
    }

    #status {
      margin-top: 14px;
      min-height: 20px;
      font-size: 14px;
      color: #6b7280;
      word-break: break-word;
    }

    #userPanel {
      display: none;
    }

    .email {
      margin: 12px 0 0;
      font-weight: 600;
      word-break: break-word;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111827;
        color: #f9fafb;
      }

      .card {
        background: #1f2937;
        border-color: #374151;
      }

      input {
        background: #111827;
        border-color: #4b5563;
        color: #f9fafb;
      }

      .sub, #status {
        color: #9ca3af;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <section id="loginPanel">
      <h1>Simplenote Plus</h1>
      <p class="sub">使用你的 Email 與密碼登入</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <button type="submit">Sign in</button>
      </form>

      <div id="status"></div>
    </section>

    <section id="userPanel">
      <h1>登入成功</h1>
      <p class="sub">Supabase Authentication 已連線。</p>
      <div>目前帳號：</div>
      <div class="email" id="currentEmail"></div>
      <button class="secondary" id="signOutBtn" type="button">Sign out</button>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://hsopdjksfetykjwhdpgp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tr9b-wjvVaATe0_nnfu6Sw_dOux8m1h";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const loginPanel = document.getElementById("loginPanel");
    const userPanel = document.getElementById("userPanel");
    const loginForm = document.getElementById("loginForm");
    const statusEl = document.getElementById("status");
    const currentEmail = document.getElementById("currentEmail");
    const signOutBtn = document.getElementById("signOutBtn");

    function showLoggedIn(user) {
      loginPanel.style.display = "none";
      userPanel.style.display = "block";
      currentEmail.textContent = user?.email ?? "(unknown)";
    }

    function showLoggedOut(message = "") {
      userPanel.style.display = "none";
      loginPanel.style.display = "block";
      statusEl.textContent = message;
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      statusEl.textContent = "登入中...";

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        statusEl.textContent = "登入失敗：" + error.message;
        return;
      }

      showLoggedIn(data.user);
    });

    signOutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      showLoggedOut("已登出。");
    });

    const { data: { session } } = await supabase.auth.getSession();

    if (session?.user) {
      showLoggedIn(session.user);
    } else {
      showLoggedOut();
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        showLoggedIn(session.user);
      } else {
        showLoggedOut();
      }
    });
  </script>
</body>
</html>
